<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}body{margin:0;font:14px system-ui}img{max-width:100%}[hidden]{display:none!important}</style></head><body>
<title>ReconForge v2 Dashboard</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&display=swap">
<style>
/* Layout: one terminal window on a quiet desk. Inside: tabs on top, the screen, a key-hint bar, a status bar. */
:root{
  --desk:#0a0d12; --term:#10141b; --raise:#19202a; --sel:#1a2736; --line:#2a3242; --line-soft:#1d2430;
  --fg:#dde2ea; --muted:#8e98aa; --dim:#646e80;
  --heat:#f2a33a; --heat-ink:#1b1200; --focus:#79c4e6;
  --ok:#62cc8e; --warn:#e6c35c; --bad:#ff6f6f;
  --shadow:0 24px 60px -20px rgba(0,0,0,.55);
  --mono:"JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  --sans:"IBM Plex Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    --desk:#e3e7ed; --term:#f9fafb; --raise:#edf0f4; --sel:#dde9f4; --line:#c9d0db; --line-soft:#e1e5eb;
    --fg:#18202c; --muted:#525d6f; --dim:#7d8798;
    --heat:#a65c00; --heat-ink:#ffffff; --focus:#1b6c9b;
    --ok:#1c874a; --warn:#8a6600; --bad:#c23333;
    --shadow:0 24px 60px -24px rgba(20,30,50,.28);
    color-scheme:light;
  }
}
:root[data-theme="light"]{
  --desk:#e3e7ed; --term:#f9fafb; --raise:#edf0f4; --sel:#dde9f4; --line:#c9d0db; --line-soft:#e1e5eb;
  --fg:#18202c; --muted:#525d6f; --dim:#7d8798;
  --heat:#a65c00; --heat-ink:#ffffff; --focus:#1b6c9b;
  --ok:#1c874a; --warn:#8a6600; --bad:#c23333;
  --shadow:0 24px 60px -24px rgba(20,30,50,.28);
  color-scheme:light;
}
/* In-app skins (Settings > Appearance) override the tokens inside the terminal only. */
.term[data-skin="forge"]{
  --term:#10141b; --raise:#19202a; --sel:#1a2736; --line:#2a3242; --line-soft:#1d2430;
  --fg:#dde2ea; --muted:#8e98aa; --dim:#646e80; --heat:#f2a33a; --heat-ink:#1b1200; --focus:#79c4e6;
  --ok:#62cc8e; --warn:#e6c35c; --bad:#ff6f6f; color-scheme:dark;
}
.term[data-skin="daylight"]{
  --term:#f9fafb; --raise:#edf0f4; --sel:#dde9f4; --line:#c9d0db; --line-soft:#e1e5eb;
  --fg:#18202c; --muted:#525d6f; --dim:#7d8798; --heat:#a65c00; --heat-ink:#ffffff; --focus:#1b6c9b;
  --ok:#1c874a; --warn:#8a6600; --bad:#c23333; color-scheme:light;
}
.term[data-skin="contrast"]{
  --term:#000000; --raise:#141414; --sel:#00293a; --line:#8a8a8a; --line-soft:#404040;
  --fg:#ffffff; --muted:#d6d6d6; --dim:#a8a8a8; --heat:#ffd23f; --heat-ink:#000000; --focus:#5ce1ff;
  --ok:#5dff9a; --warn:#ffe066; --bad:#ff8080; color-scheme:dark;
}

*{box-sizing:border-box}
body{background:var(--desk); color:var(--fg); font-family:var(--sans)}
.desk{max-width:1280px; margin:0 auto; padding-block:18px 28px;
  padding-left:max(16px, env(safe-area-inset-left, 0px)); padding-right:max(16px, env(safe-area-inset-right, 0px));
  display:flex; flex-direction:column; gap:14px}
.note{display:flex; flex-wrap:wrap; align-items:baseline; gap:6px 18px; color:var(--muted); font-size:13.5px; line-height:1.5}
.note strong{color:var(--fg); font-weight:600}
.note p{margin:0}

.term{background:var(--term); color:var(--fg); border:1px solid var(--line); border-radius:10px; box-shadow:var(--shadow);
  font-family:var(--mono); font-size:13px; line-height:1.55; display:flex; flex-direction:column; min-height:660px; overflow:hidden; position:relative}
.term[data-density="compact"]{font-size:12.2px; line-height:1.4}
.titlebar{display:flex; justify-content:space-between; gap:12px; padding:7px 14px; border-bottom:1px solid var(--line-soft); color:var(--dim); font-size:11.5px; white-space:nowrap; overflow:hidden}
.titlebar span:last-child{overflow:hidden; text-overflow:ellipsis}
.topbar{display:flex; align-items:stretch; gap:6px; border-bottom:1px solid var(--line); padding:0 8px 0 14px; min-width:0}
.brand{display:flex; align-items:center; gap:2px; padding-right:10px; font-weight:700; letter-spacing:.01em; white-space:nowrap}
.brand .r{color:var(--fg)} .brand .f{color:var(--heat)} .brand small{color:var(--dim); font-weight:500; margin-left:6px; font-size:11px}
.tabs{display:flex; overflow-x:auto; scrollbar-width:thin; min-width:0; flex:1}
.tab{appearance:none; background:none; border:0; border-bottom:2px solid transparent; color:var(--muted); font:inherit; padding:10px 10px 9px; cursor:pointer; white-space:nowrap; display:flex; align-items:center; gap:6px}
.tab:hover{color:var(--fg)}
.tab.on{color:var(--fg); border-bottom-color:var(--heat)}
.tab .tk{color:var(--dim); font-size:11px}
.badge{min-width:18px; padding:0 5px; border-radius:9px; background:var(--raise); border:1px solid var(--line); color:var(--fg); font-size:10.5px; line-height:16px; text-align:center}
.badge.live{border-color:var(--heat); color:var(--heat)}
.palbtn{appearance:none; align-self:center; background:var(--raise); color:var(--muted); border:1px solid var(--line); border-radius:6px; font:inherit; font-size:11.5px; padding:4px 8px; cursor:pointer; white-space:nowrap}
.palbtn:hover{color:var(--fg)}

main{flex:1; min-width:0; padding:18px 16px 20px}
.keys{display:flex; flex-wrap:wrap; gap:4px 16px; padding:7px 14px; border-top:1px solid var(--line); color:var(--muted); font-size:12px}
.keys .k{display:inline-flex; gap:6px; align-items:center; background:none; border:0; padding:2px 0; color:inherit; font:inherit; cursor:pointer}
.keys .k:hover{color:var(--fg)}
.keys .k.static{cursor:default}
.status{display:flex; flex-wrap:wrap; gap:4px 18px; padding:6px 14px; border-top:1px solid var(--line-soft); color:var(--dim); font-size:11.5px; font-variant-numeric:tabular-nums}
.status b{color:var(--muted); font-weight:500}
.status .grow{flex:1}
.dot{display:inline-block; width:7px; height:7px; border-radius:50%; background:var(--dim); margin-right:5px; vertical-align:1px}
.dot.on{background:var(--heat); animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{opacity:.35}}

kbd{font-family:var(--mono); font-size:10.5px; border:1px solid var(--line); border-bottom-width:2px; border-radius:4px; padding:0 5px; color:var(--muted); background:var(--raise); white-space:nowrap}
button:focus-visible, [tabindex]:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible{outline:2px solid var(--focus); outline-offset:1px}

/* screen primitives */
h1{font-size:17px; margin:0; font-weight:700; letter-spacing:.01em}
h2{font-size:13px; margin:0; font-weight:700}
.sub{margin:2px 0 0; color:var(--muted)}
.head{display:flex; flex-wrap:wrap; justify-content:space-between; align-items:flex-end; gap:10px 16px}
.stack{display:flex; flex-direction:column; gap:18px; min-width:0}
.cols{display:grid; grid-template-columns:minmax(0,2fr) minmax(0,1fr); gap:20px; align-items:start}
.split{display:grid; grid-template-columns:minmax(0,1.45fr) minmax(0,1fr); gap:20px; align-items:start}
.side{display:grid; grid-template-columns:minmax(0,15rem) minmax(0,1fr); gap:20px; align-items:start}
@media (max-width:900px){ .cols,.split,.side{grid-template-columns:minmax(0,1fr)} }

.panel{position:relative; border:1px solid var(--line); border-radius:7px; padding:18px 14px 14px; min-width:0}
.ptitle{position:absolute; top:-.78em; left:10px; padding:0 6px; background:var(--term); color:var(--muted); font-size:11px; letter-spacing:.09em; text-transform:uppercase; white-space:nowrap}
.ptitle b{color:var(--heat); font-weight:700}
.muted{color:var(--muted)} .dim{color:var(--dim)} .ok{color:var(--ok)} .warn{color:var(--warn)} .bad{color:var(--bad)} .hot{color:var(--heat)}
.mono-num{font-variant-numeric:tabular-nums}
.hr{border-top:1px dashed var(--line); margin:4px 0}

.btn{appearance:none; font:inherit; color:var(--fg); background:var(--raise); border:1px solid var(--line); border-radius:6px; padding:6px 12px; cursor:pointer; white-space:nowrap; display:inline-flex; align-items:center; gap:8px}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--heat); color:var(--heat-ink); border-color:var(--heat); font-weight:700}
.btn.primary kbd{background:transparent; color:var(--heat-ink); border-color:currentColor; opacity:.7}
.btn.danger{color:var(--bad); border-color:var(--bad); background:transparent}
.btn.small{padding:3px 9px; font-size:12px}
.btn.link{background:none; border-color:transparent; color:var(--focus); padding:2px 4px}
.btn[disabled]{opacity:.45; cursor:not-allowed}
.btns{display:flex; flex-wrap:wrap; gap:8px}

.chips{display:flex; flex-wrap:wrap; gap:8px}
.chip{appearance:none; font:inherit; color:var(--fg); background:transparent; border:1px solid var(--line); border-radius:999px; padding:5px 12px; cursor:pointer; display:inline-flex; gap:8px; align-items:baseline}
.chip small{color:var(--dim); font-size:11px}
.chip.on{border-color:var(--heat); background:var(--sel)}
.chip.on::before{content:"●"; color:var(--heat); font-size:9px; align-self:center}
.chip.add{color:var(--focus); border-style:dashed}
.pill{display:inline-block; font-size:11px; line-height:17px; padding:0 7px; border-radius:4px; border:1px solid var(--line); color:var(--muted); white-space:nowrap}
.st-done{color:var(--ok); border-color:var(--ok)}
.st-running{color:var(--heat); border-color:var(--heat)}
.st-paused{color:var(--warn); border-color:var(--warn)}
.st-cancelled{color:var(--dim)}
.st-partial{color:var(--warn); border-color:var(--warn)}
.tag{display:inline-block; font-size:11px; padding:0 6px; border-radius:4px; background:var(--raise); color:var(--muted); margin:1px 4px 1px 0; white-space:nowrap}
.tag.new{color:var(--heat)} .tag.changed{color:var(--focus)} .tag.takeover,.tag.expiring{color:var(--bad)}
.score{display:inline-block; min-width:2.6ch; text-align:right; font-weight:700; font-variant-numeric:tabular-nums}
.s-hot{color:var(--bad)} .s-warm{color:var(--heat)} .s-mid{color:var(--focus)} .s-low{color:var(--dim)}

/* forms */
label.f{display:flex; flex-direction:column; gap:4px; font-size:12px; color:var(--muted); min-width:0}
input[type=text], input[type=number], input[type=password], select, textarea{
  font:inherit; color:var(--fg); background:var(--raise); border:1px solid var(--line); border-radius:6px; padding:6px 9px; min-width:0; width:100%}
textarea{resize:vertical; line-height:1.5}
select{cursor:pointer}
.check{display:flex; gap:10px; align-items:flex-start; cursor:pointer}
.check input{accent-color:var(--heat); margin-top:3px}
.check small{display:block; color:var(--dim)}
.check.off{opacity:.5; cursor:not-allowed}
.formgrid{display:grid; grid-template-columns:repeat(auto-fit, minmax(13rem, 1fr)); gap:12px}
.seg{display:inline-flex; border:1px solid var(--line); border-radius:6px; overflow:hidden; flex-wrap:wrap}
.seg button{appearance:none; font:inherit; background:none; color:var(--muted); border:0; border-right:1px solid var(--line); padding:5px 11px; cursor:pointer}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--sel); color:var(--fg)}
.seg button[disabled]{opacity:.4; cursor:not-allowed}
.field-row{display:flex; flex-wrap:wrap; gap:10px 18px; align-items:center}
.err{color:var(--bad); font-size:12px}
.notice{border:1px solid var(--line); border-left:3px solid var(--warn); border-radius:6px; padding:8px 12px; color:var(--muted)}
.notice.bad{border-left-color:var(--bad)}
.notice.info{border-left-color:var(--focus)}

/* new scan */
.presets{display:grid; grid-template-columns:repeat(auto-fit, minmax(8.5rem, 1fr)); gap:10px}
.preset{appearance:none; text-align:left; font:inherit; color:var(--fg); background:transparent; border:1px solid var(--line); border-radius:7px; padding:10px 12px; cursor:pointer; display:flex; flex-direction:column; gap:6px; min-width:0}
.preset:hover{border-color:var(--muted)}
.preset.on{border-color:var(--heat); background:var(--sel)}
.preset.locked{opacity:.5; cursor:not-allowed}
.preset .pn{font-weight:700; display:flex; justify-content:space-between; gap:8px}
.preset .pd{color:var(--muted); font-size:12px; line-height:1.45}
.preset .pm{color:var(--dim); font-size:11.5px}
.steps{display:flex; flex-wrap:wrap; gap:4px 6px; color:var(--dim); font-size:12px; margin-top:12px}
.steps span{color:var(--muted)} .steps i{font-style:normal; color:var(--dim)}
.modlist{display:grid; grid-template-columns:repeat(auto-fit, minmax(17rem,1fr)); gap:8px 16px; margin-top:12px}
.tsum{display:flex; flex-wrap:wrap; gap:4px 16px; margin-top:12px; color:var(--muted); font-size:12px}
.tsum b{color:var(--fg); font-weight:500}
.launch{display:flex; flex-wrap:wrap; justify-content:space-between; align-items:center; gap:12px; border:1px solid var(--line); border-radius:7px; padding:12px 14px; background:var(--raise)}
.launch p{margin:0; color:var(--muted); min-width:0}
.launch p b{color:var(--fg)}
.histbtn{appearance:none; width:100%; text-align:left; font:inherit; color:var(--fg); background:var(--raise); border:1px solid var(--line); border-radius:8px; padding:14px 16px; cursor:pointer; display:grid; grid-template-columns:1fr auto; gap:4px 10px}
.histbtn:hover{border-color:var(--heat)}
.histbtn .t{font-size:15px; font-weight:700}
.histbtn .s{grid-column:1/-1; color:var(--muted); font-size:12px}
.mini{display:flex; flex-direction:column}
.mini button{appearance:none; font:inherit; color:var(--fg); background:none; border:0; border-bottom:1px solid var(--line-soft); text-align:left; padding:7px 2px; cursor:pointer; display:grid; grid-template-columns:auto minmax(0,1fr) auto; gap:10px; align-items:baseline}
.mini button:last-child{border-bottom:0}
.mini button:hover{background:var(--raise)}
.mini .m1{overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.plan{display:grid; grid-template-columns:auto minmax(0,1fr); gap:4px 16px; font-size:12.5px}
.plan span:nth-child(odd){color:var(--heat)}
.plan span:nth-child(even){color:var(--muted)}

/* running */
.runcards{display:flex; flex-direction:column; gap:8px}
.runcard{appearance:none; font:inherit; color:var(--fg); text-align:left; background:transparent; border:1px solid var(--line); border-radius:7px; padding:10px 12px; cursor:pointer; display:flex; flex-direction:column; gap:3px}
.runcard.on{border-color:var(--heat); background:var(--sel)}
.runcard .rb{color:var(--focus); letter-spacing:-1px; overflow:hidden; white-space:nowrap}
.bf{color:inherit} .be{color:var(--line)}
.mods{display:flex; flex-direction:column}
.mod{display:grid; grid-template-columns:minmax(0,18ch) 21ch 5ch minmax(0,13ch) minmax(0,1fr); gap:0 12px; align-items:baseline; padding:3px 0; font-variant-numeric:tabular-nums}
.mod.head{color:var(--dim); font-size:11px; letter-spacing:.08em; text-transform:uppercase; padding-bottom:6px}
.mod .mn{overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.mod .mb{letter-spacing:-1px; white-space:nowrap; overflow:hidden; color:var(--dim)}
.mod.go .mb{color:var(--focus)} .mod.done .mb{color:var(--ok)}
.mod .mp{text-align:right; color:var(--muted)}
.mod.done .mp{color:var(--ok)}
.mod .mo{color:var(--fg); white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.mod .mx{color:var(--dim); white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
@media (max-width:760px){
  .mod{grid-template-columns:minmax(0,1fr) auto; row-gap:1px; padding:5px 0; border-bottom:1px solid var(--line-soft)}
  .mod .mb{grid-column:1/-1; order:3}
  .mod .mo{grid-column:1/-1; order:4; color:var(--muted); font-size:12px}
  .mod .mx,.mod.head{display:none}
}
.feed{display:flex; flex-direction:column; gap:2px; font-size:12px; max-height:15.5em; overflow:auto}
.feed div{display:grid; grid-template-columns:8ch 19ch minmax(0,1fr); gap:12px; white-space:nowrap}
.feed div span{overflow:hidden; text-overflow:ellipsis}
.feed div span:last-child{overflow:hidden; text-overflow:ellipsis}
.feed .ft{color:var(--dim)} .feed .fm{color:var(--heat)}
@media (max-width:620px){ .feed div{grid-template-columns:minmax(0,1fr); white-space:normal; gap:0; padding:3px 0; border-bottom:1px solid var(--line-soft)} .feed .ft{display:none} }
.runhead{display:flex; flex-wrap:wrap; justify-content:space-between; align-items:center; gap:10px 16px}
.ratectl{display:inline-flex; align-items:center; gap:6px}
.ratectl b{min-width:9ch; text-align:center; font-weight:500}

/* tables */
.tw{overflow-x:auto; min-width:0}
table.t{width:100%; border-collapse:collapse; font-variant-numeric:tabular-nums}
.t th{color:var(--dim); font-weight:500; text-align:left; font-size:11px; letter-spacing:.08em; text-transform:uppercase; padding:4px 10px 7px; border-bottom:1px solid var(--line); white-space:nowrap}
.t td{padding:7px 10px; border-bottom:1px solid var(--line-soft); white-space:nowrap; vertical-align:baseline}
.t tr.row{cursor:pointer}
.t tr.row:hover td{background:var(--raise)}
.t tr.sel td{background:var(--sel)}
.t tr.sel td:first-child{box-shadow:inset 2px 0 0 var(--heat)}
.t td.wrap{white-space:normal; min-width:16ch}
.t .r{text-align:right}
.filters{display:flex; flex-wrap:wrap; gap:10px; align-items:flex-end}
.filters label.f{width:auto; min-width:9rem}
.filters .grow{flex:1; min-width:12rem}

/* report */
.rtabs{display:flex; flex-wrap:wrap; gap:4px; border-bottom:1px solid var(--line)}
.rtabs button{appearance:none; font:inherit; background:none; border:0; border-bottom:2px solid transparent; color:var(--muted); padding:7px 10px; cursor:pointer}
.rtabs button.on{color:var(--fg); border-bottom-color:var(--focus)}
.stats{display:grid; grid-template-columns:repeat(auto-fit, minmax(8.5rem,1fr)); gap:10px}
.stat{border:1px solid var(--line-soft); border-radius:7px; padding:10px 12px}
.stat b{display:block; font-size:20px; font-weight:700; font-variant-numeric:tabular-nums}
.stat span{color:var(--muted); font-size:12px}
.diff{display:flex; flex-direction:column}
.diff div{display:grid; grid-template-columns:2ch minmax(0,24ch) minmax(0,1fr) 4ch; gap:12px; padding:6px 0; border-bottom:1px solid var(--line-soft); align-items:baseline}
.diff .k{font-weight:700}
.diff .k.add{color:var(--ok)} .diff .k.chg{color:var(--focus)} .diff .k.del{color:var(--bad)}
.diff .h{overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
@media (max-width:620px){ .diff div{grid-template-columns:2ch minmax(0,1fr) 4ch} .diff div .d{grid-column:2/-1; color:var(--muted); font-size:12px} }
.prio{display:flex; flex-direction:column; gap:2px}
.prio div{display:grid; grid-template-columns:3ch minmax(0,24ch) minmax(0,1fr); gap:12px; padding:5px 0; align-items:baseline}
.prio .h{overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
@media (max-width:620px){ .prio div{grid-template-columns:3ch minmax(0,1fr)} .prio div span:last-child{grid-column:2; color:var(--muted); font-size:12px} }
.prose{max-width:72ch; color:var(--fg); line-height:1.65; margin:0}
ul.plain{margin:0; padding-left:18px; color:var(--muted); display:flex; flex-direction:column; gap:4px}

/* targets */
.tlist{display:flex; flex-direction:column; gap:8px}
.tcard{appearance:none; font:inherit; color:var(--fg); text-align:left; background:transparent; border:1px solid var(--line); border-radius:7px; padding:10px 12px; cursor:pointer; display:flex; flex-direction:column; gap:2px}
.tcard.on{border-color:var(--heat); background:var(--sel)}
.tcard small{color:var(--muted)}
.rules{display:flex; flex-direction:column}
.rules div{display:grid; grid-template-columns:4ch minmax(0,1fr) auto; gap:10px; align-items:center; padding:4px 0; border-bottom:1px solid var(--line-soft)}
.rules .in{color:var(--ok)} .rules .out{color:var(--bad)}
.rules .x{appearance:none; background:none; border:0; color:var(--dim); font:inherit; cursor:pointer; padding:0 4px}
.rules .x:hover{color:var(--bad)}
.addrule{display:grid; grid-template-columns:6.5rem minmax(0,1fr) auto; gap:8px; margin-top:10px}
.tester{display:flex; flex-direction:column; gap:6px}
.tres{min-height:1.5em; font-size:12.5px}
.kv{display:grid; grid-template-columns:minmax(0,12ch) minmax(0,1fr); gap:6px 14px; align-items:baseline}

function normHost(v) {

}

  for (const [k, r] of rules) if (k === "out" && ruleMatches(host, r)) return {state:"out", host, why:`excluded by ${r}`};
  for (const [k, r] of rules) if (k === "in" && ruleMatches(host, r)) return {state:"in", host, why:`matched ${r}`};

  return {state:"out", host, why: apex ? `no rule matched (${apex[1]} covers subdomains, not the bare domain)` : "no scope rule matched"};
}

function modState(r, m, i) { if (m.p >= 100) return "done"; if (i === 0 || r.mods[i - 1].p >= 25) return m.p > 0 ? "go" : "wait"; return "wait"; }

  "takeover.check":"CNAME fingerprints", "score":"new + interesting first", "ai.triage":"triage model", "dns.brute":"wildcard-safe", "dns.permute":"dev-, -staging, -v2",

function overall(r) { return Math.floor(r.mods.reduce((a, m) => a + m.p, 0) / r.mods.length); }

    } else if (id === "port") {

    } else if (id === "rdap") {
      out = `<span class="h">registrar </span> Example Registrar, Inc.\n<span class="h">created   </span> 2009-03-14\n<span class="h">expires   </span> 2027-03-14\n<span class="h">nameserver</span> ns1.${esc(h)}, ns2.${esc(h)}\n<span class="h">status    </span> clientTransferProhibited`;

    } else if (id === "favicon") {
      out = `<span class="h">favicon </span> ${esc(v.v.replace(/\/$/, ""))}/favicon.ico\n<span class="h">mmh3    </span> 81586312\n<span class="h">matches </span> Jenkins default icon\n<span class="h">shodan  </span> http.favicon.hash:81586312`;
    } else if (id === "scope") {

    } else if (id === "decode") {

    } else if (id === "cidr") {

    }

  $("#tool-out").innerHTML = `<pre class="raw">${out}</pre>`;
}

/* ───────────────────────── scans (simulated) ───────────────────────── */
function feedLine(r) {
  const a = assetsFor(r.target), x = a[Math.floor(Math.random() * a.length)], d = domainOf(r.target);
  const active = r.mods.find((m, i) => m.p < 100 && (i === 0 || r.mods[i - 1].p >= 25)) || r.mods[r.mods.length - 1];
  const L = {
    "passive.subdomains":[`crt.sh +${3 + Math.floor(Math.random() * 30)} names`, `certspotter +${2 + Math.floor(Math.random() * 9)} names`, `wayback +${1 + Math.floor(Math.random() * 6)} names`],
    "passive.urls":[`${100 + Math.floor(Math.random() * 400)} archived URLs for ${d}`], "passive.certs":[`certificate for ${x.host} issued ${1 + Math.floor(Math.random() * 30)} days ago`],
    "dns.resolve":[`${x.host} → ${x.ip}`, `wildcard *.${d} detected, ${8 + Math.floor(Math.random() * 20)} answers dropped`],
    "dns.brute":[`hit ${["vpn","git","sso","backup"][Math.floor(Math.random() * 4)]}.${d}`], "dns.permute":[`hit ${x.host.replace(".", "-v2.")}`],
    "scope.gate":[`skipped blog.${d} (out of scope)`, `${x.host} in scope`],
    "port.scan":[`open ${x.host}:${x.port}/tcp`, `skipped CDN edge 203.0.113.${200 + Math.floor(Math.random() * 50)}`],
    "http.probe":[`${x.code} https://${x.host}${x.port !== 443 ? ":" + x.port : ""}  "${x.title}"`],
    "tls.inspect":[`SAN ci-internal.${d} → in scope, queued`, `${x.host} cert expires in ${x.tls ? x.tls.days : 90} days`],
    "tech.detect":[`${x.host}: ${x.tech.join(", ")}`], "takeover.check":[`${x.host}: CNAME ok`, `docs.${d}: unclaimed GitHub Pages site`],
    "js.extract":[`${x.host}/static/app.js: ${5 + Math.floor(Math.random() * 40)} endpoints`], "screenshot":[`${x.host} captured`],
    "score":[`${x.host} scored ${x.score}`], "ai.triage":[`${x.host}: ${x.why[0]}`],
  }[active.id] || ["working"];
  return [active.id, L[Math.floor(Math.random() * L.length)]];
}
function feedPush(r, mod, text) { r.feed.unshift({t:clock(), mod, text}); if (r.feed.length > 60) r.feed.length = 60; }
function makeScan(target, preset, mods, speed = 1) {
  const r = {id:nextId++, target, preset, started:Date.now(), mods:mods.map(id => ({id, p:0})), paused:false, rate:Math.min(S.rate || TARGETS[target].rate, TARGETS[target].rate), speed, feed:[]};
  feedPush(r, "scan", `started ${presetOf(preset).name.toLowerCase()} on ${target} · ${mods.length} steps · max ${r.rate} req/s`);
  RUNNING.push(r); return r;
}
function startScan() {
  const t = TARGETS[S.target]; if (requiredLevel() > t.level) return;
  const r = makeScan(S.target, S.preset, currentMods());
  S.runSel = r.id; S.showDry = false;
  setView("running"); toast(`Started scan #${r.id} on ${S.target}`);
}
function finishScan(r, status) {
  RUNNING.splice(RUNNING.indexOf(r), 1);
  const t = TARGETS[r.target], f = overall(r) / 100, same = HISTORY.find(h => h.target === r.target && h.preset === r.preset && h.status === "done");
  const rec = {id:r.id, target:r.target, preset:r.preset, started:"Today " + new Date(r.started).toTimeString().slice(0, 5), took:fmtDur(Date.now() - r.started), status,
    hosts:Math.max(1, Math.round((t.hosts || 12) * (status === "done" ? 1 : f))), apps:r.mods.some(m => m.id === "http.probe") ? Math.round((t.apps || 5) * (status === "done" ? 1 : f)) : 0,
    services:r.mods.some(m => m.id === "port.scan" || m.id === "http.probe") ? Math.round((t.services || 5) * (status === "done" ? 1 : f)) : 0,
    add:status === "done" ? (same ? Math.floor(Math.random() * 3) : (t.hosts || 5)) : 0, chg:status === "done" && same ? Math.floor(Math.random() * 2) : 0, del:0,
    since:status === "done" ? (same ? same.id : null) : null, note:status === "cancelled" ? `Cancelled by you at ${overall(r)}%. Results up to that point were kept.` : ""};
  if (!t.hosts) { t.hosts = rec.hosts; t.services = rec.services; t.apps = rec.apps; }
  HISTORY.unshift(rec);
  if (S.cancelAsk === r.id) S.cancelAsk = null;
  toast(`Scan #${r.id} on ${r.target} ${status === "done" ? "finished" : "cancelled"}`, {label:"View report", fn:() => openReport(r.id)});
}
function tick() {
  let changed = false;
  for (const r of [...RUNNING]) {
    if (r.paused) continue;
    const t = TARGETS[r.target], sp = r.speed * Math.max(.15, r.rate / t.rate);
    r.mods.forEach((m, i) => {
      if (m.p >= 100) return;
      const prev = i ? r.mods[i - 1] : null;
      if (prev && prev.p < 25) return;
      const cap = !prev || prev.p >= 100 ? 100 : prev.p;
      m.p = Math.min(cap, m.p + (2 + Math.random() * 5) * sp);
      if (m.p > 99.4 && cap === 100) m.p = 100;
    });
    if (Math.random() < .6) feedPush(r, ...feedLine(r));
    if (r.mods.every(m => m.p >= 100)) { finishScan(r, "done"); changed = true; }
  }
  if (changed && ["running","new-scan","history"].includes(S.view)) render();
  else updateLive();
  updateBadges(); updateStatus();
}
function updateLive() {
  for (const r of RUNNING) {
    const p = overall(r);
    $$(`[data-live="pct-${r.id}"]`).forEach(el => el.textContent = p + "%");
    $$(`[data-live="bar-${r.id}"]`).forEach(el => el.innerHTML = bar(p, 16));
    $$(`[data-live="st-${r.id}"]`).forEach(el => el.textContent = r.paused ? "paused" : "running");
    $$(`[data-live="el-${r.id}"]`).forEach(el => el.textContent = fmtDur(Date.now() - r.started));
    if (S.view === "running" && S.runSel === r.id) {
      r.mods.forEach((m, i) => {
        const row = $(`[data-live="m-${r.id}-${i}"]`); if (!row) return;
        const st = modState(r, m, i); row.className = "mod " + st;
        row.children[1].innerHTML = bar(m.p);
        row.children[2].textContent = st === "done" ? "done" : st === "wait" ? "wait" : Math.floor(m.p) + "%";
        row.children[3].textContent = modOut(r, m);
      });
      const feed = $("#feed"); if (feed) feed.innerHTML = feedHtml(r);
    }
  }
}

/* ───────────────────────── toasts + overlays ───────────────────────── */
function toast(msg, action) {
  const el = document.createElement("div"); el.className = "toast";
  el.innerHTML = `<span>${esc(msg)}</span>`;
  if (action) { const b = document.createElement("button"); b.className = "btn small"; b.textContent = action.label; b.onclick = () => { action.fn(); el.remove(); }; el.appendChild(b); }

const overlay = $("#overlay");

function fuzzy(q, s) { if (!q) return 1; q = q.toLowerCase(); s = s.toLowerCase(); const i0 = s.indexOf(q); if (i0 >= 0) return 100 - i0; let j = 0; for (const c of s) if (c === q[j]) j++; return j === q.length ? 10 : 0; }
function openPalette(q = "") {

  $("#pal-list").innerHTML = palItems.length ? palItems.map((x, i) => `<button class="${i === palSel ? "on" : ""}" data-act="pal-run" data-i="${i}"><span>${i === palSel ? '<span class="hot">▸ </span>' : "  "}${esc(x.l)}</span><small>${esc(x.h)}</small></button>`).join("") : `<p class="muted" style="padding:8px 10px;margin:0">No command matches.</p>`;

/* ───────────────────────── actions ───────────────────────── */
function setPath(obj, path, val) { const ks = path.split("."); let o = obj; for (let i = 0; i < ks.length - 1; i++) o = (o[ks[i]] ??= {}); o[ks[ks.length - 1]] = val; }
const ACT = {

  "nt-toggle": () => { S.nt.open = !S.nt.open; S.nt.err = ""; render(); if (S.nt.open) $("#nt-name")?.focus(); },

  ports: d => { S.ports = d.v; render(); },

  rate: d => { const r = RUNNING.find(x => x.id === S.runSel); if (!r) return; const max = TARGETS[r.target].rate;
    const next = +d.d > 0 ? Math.min(max, Math.ceil(r.rate * 1.5)) : Math.max(1, Math.floor(r.rate / 1.5));
    if (+d.d > 0 && r.rate >= max) { toast(`${r.target}'s rules cap speed at ${max} req/s`); return; }

  export: d => { const s = findScan(S.reportId); toast(`Prototype: would save ${s.target}-scan-${s.id}.${d.f}`); },
  "open-asset": d => { S.aTarget = d.t; S.aSel = d.h; S.aQuery = ""; setView("assets"); },
  "tgt-sel": d => { S.tgtSel = d.id; S.importOpen = false; render(); },
  "new-target-from-targets": () => { S.nt.open = true; setView("new-scan"); $("#nt-name")?.focus(); },
  "import-toggle": () => { S.importOpen = !S.importOpen; render(); },
  import: d => { S.importOpen = false; render(); toast(`Prototype: would import ${S.tgtSel}'s scope from ${d.src}`); },
  "tgt-scan": () => { S.target = S.tgtSel; S.rate = TARGETS[S.tgtSel].rate; setView("new-scan"); },
  "rule-del": d => { TARGETS[S.tgtSel].scope.splice(+d.i, 1); render(); },
  "asset-sel": d => { S.aSel = d.h; $("#asset-table").innerHTML = assetTable(); $("#asset-detail").innerHTML = assetDetail(); },
  atab: d => { S.aTab = d.id; $("#asset-detail").innerHTML = assetDetail(); },
  atag: d => { S.tags[d.h] = S.tags[d.h] === d.v ? "" : d.v; $("#asset-table").innerHTML = assetTable(); $("#asset-detail").innerHTML = assetDetail(); },
  q: d => { S.aQuery = (S.aQuery ? S.aQuery + " " : "") + d.q; const i = $("#a-query"); if (i) i.value = S.aQuery; $("#asset-table").innerHTML = assetTable(); $("#asset-detail").innerHTML = assetDetail(); },
  "ask-ai": d => { S.chatTarget = S.aTarget; setView("ai"); const i = $("#chat-in"); if (i) { i.value = `What should I test first on ${d.h}?`; i.focus(); } },

document.addEventListener("click", e => {
  const el = e.target.closest("[data-act]"); if (!el || el.disabled) return;
  if (el.matches('input[type="checkbox"]')) return; /* handled on change */
  if (el.tagName === "BUTTON" && el.type === "submit" && el.form) return;
  const f = ACT[el.dataset.act]; if (f) f(el.dataset, el, e);
});
document.addEventListener("change", e => {
  const el = e.target;
  if (el.matches('input[type="checkbox"][data-act]')) { ACT[el.dataset.act]?.(el.dataset, el, e); return; }
  if (el.dataset.actChange === "ap-preset") { const p = PROVIDER_PRESETS.find(x => x.id === el.value); S.addProv.preset = p.id; S.addProv.url = p.url; S.addProv.err = ""; render(); $("#ap-preset")?.focus(); return; }

  if (el.matches("select[data-bind]")) { setPath(S, el.dataset.bind, el.value); if (el.dataset.refresh) refresh(el.dataset.refresh); else if (el.dataset.rerender != null) render(); return; }

});
document.addEventListener("input", e => {
  const el = e.target; if (!el.dataset.bind || el.tagName === "SELECT") return;
  if (el.id === "rate") return;
  setPath(S, el.dataset.bind, el.dataset.num != null ? +el.value : el.value);
  if (el.dataset.refresh) refresh(el.dataset.refresh);

function refresh(what) {
  if (what === "hist") { S.histSel = 0; $("#hist-table").innerHTML = histTable(); }
  else if (what === "scope") $("#scope-res").innerHTML = scopeResHtml();
  else if (what === "assets") { $("#asset-table").innerHTML = assetTable(); $("#asset-detail").innerHTML = assetDetail(); }
}
document.addEventListener("submit", e => {
  e.preventDefault();
  const id = e.target.id;
  if (id === "nt-form") {
    const name = S.nt.name.trim().toLowerCase().replace(/[^a-z0-9-]+/g, "-").replace(/^-+|-+$/g, "");
    const rule = S.nt.scope.trim();
    if (!name) S.nt.err = "Give the target a name.";
    else if (TARGETS[name]) S.nt.err = `There's already a target called ${name}.`;
    else if (!rule) S.nt.err = "Add at least one scope rule, like *.example.com.";

      const bb = S.nt.kind === "Bug bounty";

    }

    const v = S.ruleText.trim(); if (!v) { $("#rule-text").focus(); return; }

  }
});

document.addEventListener("keydown", e => {
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "k") { e.preventDefault(); overlay.hidden ? openPalette() : closeOverlay(); return; }
  if (!overlay.hidden) { if (e.key === "Escape") { e.preventDefault(); closeOverlay(); } return; }
  const tag = document.activeElement?.tagName;
  const typing = ["INPUT","TEXTAREA","SELECT"].includes(tag);
  if (typing) { if (e.key === "Escape") document.activeElement.blur(); return; }
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  const k = e.key;
  if (/^[1-9]$/.test(k)) { e.preventDefault(); ACT.go({v:TABS[+k - 1][0]}); return; }
  if (k === "?") { e.preventDefault(); openHelp(); return; }
  if (k === "/") { const s = $("[data-search]"); if (s) { e.preventDefault(); s.focus(); } return; }
  if (k === "Escape") { if (S.view === "report") setView("history"); else if (S.view !== "new-scan") setView("new-scan"); return; }
  if (k === "Enter" && document.activeElement?.matches("[data-act][tabindex]")) { e.preventDefault(); document.activeElement.click(); return; }
  const v = S.view, lk = k.toLowerCase();
  if (v === "new-scan") { if (k === "Enter" && !document.activeElement?.matches("button")) { e.preventDefault(); startScan(); } else if (lk === "d") ACT.dry(); else if (lk === "h") setView("history"); else if (lk === "n") {} return; }
  if (lk === "n") { setView("new-scan"); return; }
  if (lk === "h" && v !== "history") { setView("history"); return; }
  if (v === "running") { if (lk === "p") ACT.pause(); else if (lk === "c") ACT["cancel-ask"](); else if (k === "+" || k === "=") ACT.rate({d:1}); else if (k === "-") ACT.rate({d:-1}); return; }
  if (v === "history") { const n = histRows().length; if (k === "ArrowDown" || lk === "j") { e.preventDefault(); S.histSel = Math.min(n - 1, S.histSel + 1); refresh("hist2"); $("#hist-table").innerHTML = histTable(); }
    else if (k === "ArrowUp" || lk === "k") { e.preventDefault(); S.histSel = Math.max(0, S.histSel - 1); $("#hist-table").innerHTML = histTable(); }
    else if (k === "Enter") { const r = histRows()[S.histSel]; if (r) openReport(r.id); } return; }
  if (v === "report") { const i = RTABS.findIndex(x => x[0] === S.reportTab); if (k === "ArrowRight") { S.reportTab = RTABS[(i + 1) % RTABS.length][0]; render(); } else if (k === "ArrowLeft") { S.reportTab = RTABS[(i + RTABS.length - 1) % RTABS.length][0]; render(); } else if (lk === "r") KEYACT.again(); return; }
  if (v === "inbox") { const n = S.inbox.filter(x => !x.done).length; if (k === "ArrowDown" || lk === "j") { e.preventDefault(); S.inSel = Math.min(n - 1, S.inSel + 1); render(); } else if (k === "ArrowUp" || lk === "k") { e.preventDefault(); S.inSel = Math.max(0, S.inSel - 1); render(); } else if ("itxs".includes(lk) && lk.length === 1) inboxDo(S.inSel, lk); return; }
  if (v === "assets") { const rows = assetRows(), i = rows.findIndex(r => r.host === S.aSel); if (k === "ArrowDown" || lk === "j") { e.preventDefault(); if (rows[i + 1]) ACT["asset-sel"]({h:rows[i + 1].host}); } else if (k === "ArrowUp" || lk === "k") { e.preventDefault(); if (rows[i - 1]) ACT["asset-sel"]({h:rows[i - 1].host}); } return; }
  if (v === "targets") { if (lk === "a") { e.preventDefault(); KEYACT.addrule(); } else if (lk === "t") { e.preventDefault(); KEYACT.testhost(); } else if (lk === "r") KEYACT.tgtscan(); return; }
  if (v === "tools") { const i = TOOLS.findIndex(t => t.id === S.tool); if (k === "ArrowDown" || lk === "j") { e.preventDefault(); S.tool = TOOLS[Math.min(TOOLS.length - 1, i + 1)].id; render(); } else if (k === "ArrowUp" || lk === "k") { e.preventDefault(); S.tool = TOOLS[Math.max(0, i - 1)].id; render(); } else if (k === "Enter") runTool(); return; }
  if (v === "config") { const i = CFG.findIndex(c => c[0] === S.cfg); if (k === "ArrowDown" || lk === "j") { e.preventDefault(); S.cfg = CFG[Math.min(CFG.length - 1, i + 1)][0]; render(); } else if (k === "ArrowUp" || lk === "k") { e.preventDefault(); S.cfg = CFG[Math.max(0, i - 1)][0]; render(); } }
});

/* ───────────────────────── boot ───────────────────────── */
(() => {
  const r = makeScan("globex", "quick", presetOf("quick").mods, .35);
  r.started = Date.now() - 74000;
  r.mods.forEach((m, i) => { m.p = Math.max(0, [96, 70, 64, 30, 0, 0][i] || 0); });
  ["crt.sh +41 names", "certspotter +9 names", "vpn.globex.example → 198.51.100.12", "skipped mail.globex.example (out of scope)", '200 https://vpn.globex.example  "SSL VPN portal"'].forEach((t, i) =>
    r.feed.unshift({t:new Date(Date.now() - (5 - i) * 4000).toTimeString().slice(0, 8), mod:["passive.subdomains","passive.subdomains","dns.resolve","scope.gate","http.probe"][i], text:t}));
  S.runSel = r.id;
  applySkin();
  const h = location.hash.slice(1);
  if (h) applyHash(); else render();
  setInterval(tick, 700);
