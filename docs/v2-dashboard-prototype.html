    add:status === "done" ? (same ? Math.floor(Math.random() * 3) : (t.hosts || 4)) : 0, chg:status === "done" && same ? Math.floor(Math.random() * 2) : 0, del:0,
    since:status === "done" ? (same ? same.id : null) : null, note:status === "cancelled" ? `Cancelled by you at ${overall(r)}%. Results up to that point were kept.` : ""});
  if (!t.hosts) { t.hosts = 4; t.services = 4; t.apps = 4; }
  msg(`Scan #${r.id} on ${r.target} ${status === "done" ? "finished" : "cancelled"}`, status === "done" ? "g" : "y", {label:"view report", fn:() => openReport(r.id)});
}
function tick() {
  for (const r of [...RUNNING]) {
    if (r.paused) continue;
    const sp = r.speed * Math.max(.15, r.rate / TARGETS[r.target].rate);
    r.mods.forEach((m, i) => {
      if (m.p >= 100) return;
      const prev = i ? r.mods[i - 1] : null; if (prev && prev.p < 25) return;
      const cap = !prev || prev.p >= 100 ? 100 : prev.p;
      m.p = Math.min(cap, m.p + (2 + Math.random() * 5) * sp); if (m.p > 99.4 && cap === 100) m.p = 100;
    });
    if (Math.random() < .6) feedPush(r, ...feedLine(r));
    if (r.mods.every(m => m.p >= 100)) finishScan(r, "done");
  }
  S.rateNow = RUNNING.filter(r => !r.paused).reduce((a, r) => a + Math.round(r.rate * (.7 + Math.random() * .3)), 0);
  render();
}

/* ════════════════════════ text input (hidden real input, works with phone keyboards) ════════════════════════ */
function focusField(id) {

}

kbdIn.addEventListener("keydown", e => {
  if (!S.focus) return;

  if (e.key === "Enter") { e.preventDefault(); meta.enter ? meta.enter() : blurField(); }
  else if (e.key === "Escape") { e.preventDefault(); blurField(); }

function placeKbd() { const f = S.focus && FIELDS[S.focus]; if (!f) return; kbdIn.style.left = (PADL + f.x * CW) + "px"; kbdIn.style.top = (PADT + f.y * LH) + "px"; kbdIn.style.width = Math.max(10, f.w * CW) + "px"; kbdIn.style.height = LH + "px"; }

/* ════════════════════════ render + mouse ════════════════════════ */
let hoverKey = "";
function zoneAt(c, pred) { for (let i = ZONES.length - 1; i >= 0; i--) { const z = ZONES[i]; if (c.x >= z.x && c.x < z.x + z.w && c.y >= z.y && c.y < z.y + z.h && pred(z)) return z; } return null; }
function render() {
  const Hmax = NARROW ? 320 : H, b = new Buf(W, Hmax);
  FIELDS = {};
  drawTop(b);
  const end = (SCREENS[S.view] || SCREENS.scan)(b, 1, 2, W - 2, NARROW ? Hmax - 8 : H - 5) || 4;
  HF = NARROW ? clamp(end + 3, 26, Hmax) : H;
  b.crop(HF);
  b.zones = b.zones.filter(z => z.y < HF - 2).map(z => ({...z, h:Math.min(z.h, HF - 2 - z.y)}));
  b.clear(0, HF - 2, W, 2);

  scr.innerHTML = toHtml(b);
  $("#wtitle").textContent = `~/hunting — reconforge — ${W}×${HF}`;
  placeKbd();
}
function cellAt(e) { const r = scr.getBoundingClientRect(); return {x:Math.floor((e.clientX - r.left - PADL) / CW), y:Math.floor((e.clientY - r.top - PADT) / LH)}; }
scr.addEventListener("mousemove", e => {
  const c = cellAt(e), z = zoneAt(c, q => q.fn);

});

scr.addEventListener("click", e => {
  const c = cellAt(e), z = zoneAt(c, q => q.fn);

  else if (S.focus) blurField();

document.addEventListener("keydown", e => {
  if (document.activeElement === kbdIn) return;
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "k") { e.preventDefault(); S.overlay === "palette" ? closeOverlay() : openPalette(); return; }
  if (e.ctrlKey || e.metaKey || e.altKey) return;

  if (/^[1-7]$/.test(k)) { stop(); go(TABS[+k - 1][0]); return; }
  if (k === "?") { stop(); openHelp(); return; }
  if (k === "Escape") { stop(); if (v === "report") go("history"); else if (v !== "scan") go("scan"); return; }
  const move = (cur, n) => (k === "ArrowDown" || lk === "j") ? clamp(cur + 1, 0, n - 1) : (k === "ArrowUp" || lk === "k") ? clamp(cur - 1, 0, n - 1) : null;
  if (v === "scan") { if (k === "Enter") { stop(); startScan(); } else if (lk === "d") openPlan(); else if (lk === "h") go("history");
    else { const i = PRESETS.findIndex(p => p.id === S.preset), n = move(i, PRESETS.length); if (n != null) { stop(); const p = PRESETS[n]; if (presetLevel(p) == null || presetLevel(p) <= TARGETS[S.target].level) pickPreset(p.id); } } return; }
  if (v === "running") { if (lk === "p") togglePause(); else if (lk === "c") askCancel(); else if (k === "+" || k === "=") { const r = RUNNING.find(q => q.id === S.runSel); r && scanRate(r, 1); } else if (k === "-") { const r = RUNNING.find(q => q.id === S.runSel); r && scanRate(r, -1); } else if (lk === "h") go("history");
    else { const i = RUNNING.findIndex(q => q.id === S.runSel), n = move(i, RUNNING.length); if (n != null) { stop(); S.runSel = RUNNING[n].id; render(); } } return; }
  if (v === "history") { const rows = histRows(), n = move(S.hSel, rows.length); if (n != null) { stop(); S.hSel = n; render(); } else if (k === "Enter" && rows[S.hSel]) { stop(); openReport(rows[S.hSel].id); } else if (lk === "n") go("scan"); return; }
  if (v === "report") { const i = RTABS.findIndex(q => q[0] === S.rtab); if (k === "ArrowRight") { stop(); S.rtab = RTABS[(i + 1) % RTABS.length][0]; render(); } else if (k === "ArrowLeft") { stop(); S.rtab = RTABS[(i + 3) % RTABS.length][0]; render(); } else if (lk === "r") runAgain();
    else if (S.rtab === "hosts") { const n = move(S.hostSel, assetsFor(findScan(S.reportId).target).length); if (n != null) { stop(); S.hostSel = n; render(); } else if (k === "/") { stop(); focusField("hostQ"); } } return; }
  if (v === "targets") { const i = ORDER.indexOf(S.tgtSel), n = move(i, ORDER.length); if (n != null) { stop(); S.tgtSel = ORDER[n]; render(); } else if (lk === "r") { S.target = S.tgtSel; go("scan"); } return; }
  if (v === "tools") { const i = TOOLS.findIndex(q => q.id === S.tool), n = move(i, TOOLS.length); if (n != null) { stop(); pickTool(TOOLS[n].id); } else if (k === "Enter") { stop(); runTool(); } return; }
  if (v === "ai") { if (k === "Enter" || k === "/") { stop(); focusField("chat"); } return; }
  if (v === "config") { const i = CFG.findIndex(q => q[0] === S.cfg), n = move(i, CFG.length); if (n != null) { stop(); S.cfg = CFG[n][0]; render(); } return; }
});

/* ════════════════════════ sizing ════════════════════════ */
function measure() {

{
