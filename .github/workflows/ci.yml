name: CI

on:
  push:
    branches:
      - main
      - "2.0"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
        python-version:
          - "3.9"
          - "3.10"
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.14"

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package
        run: python -m pip install .

      - name: Compile source
        run: python -m compileall -f reconforge

      - name: Run tests
        run: python -m unittest discover -s tests

      - name: Smoke test entry points
        run: |
          python -m reconforge --version
          reconforge --help

  package:
    name: Build wheel and source distribution
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip

      - name: Install build tooling
        run: python -m pip install build

      - name: Build distributions
        run: python -m build

      - name: Install and smoke test wheel
        run: |
          python -m pip install --force-reinstall dist/*.whl
          reconforge --version
          python -m reconforge --help

      - name: Upload distributions
        uses: actions/upload-artifact@v7
        with:
          name: reconforge-distributions
          path: dist/
          retention-days: 7
